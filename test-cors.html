<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        .success {
            background: #22c55e;
            color: white;
        }
        .error {
            background: #ef4444;
            color: white;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>CORS Test for Fire Dashboard API</h1>
    
    <button onclick="testHealth()">Test Health Endpoint</button>
    <button onclick="testAlertState()">Test Alert State</button>
    <button onclick="testSendAlert()">Test Send Alert</button>
    
    <div id="result"></div>

    <script>
        const API_URL = 'https://fire-dashboard-xi.vercel.app';

        async function testHealth() {
            showResult('Testing health endpoint...', 'info');
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                showResult(`✅ Success!\n${JSON.stringify(data, null, 2)}`, 'success');
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testAlertState() {
            showResult('Testing alert-state endpoint...', 'info');
            try {
                const response = await fetch(`${API_URL}/api/alert-state`);
                const data = await response.json();
                showResult(`✅ Success!\n${JSON.stringify(data, null, 2)}`, 'success');
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testSendAlert() {
            showResult('Testing send-alert endpoint...', 'info');
            try {
                const response = await fetch(`${API_URL}/api/send-alert`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        riskScore: 90,
                        level: 3,
                        message: 'Test Fire Alert from CORS test',
                        confidence: 0.95
                    })
                });
                const data = await response.json();
                showResult(`✅ Success!\n${JSON.stringify(data, null, 2)}`, 'success');
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<pre class="${type}">${message}</pre>`;
        }
    </script>
</body>
</html>
